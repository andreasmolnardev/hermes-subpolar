name: Bug Report
description: Report a reproducible problem in the Bun web application.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include API keys, session tokens,
        private transcripts, provider responses, or personal data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest repeatable steps and relevant `bun` commands.
      placeholder: |
        1. Run `bun run serve`.
        2. Open the web UI.
        3. Submit ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Web UI
        - HTTP API
        - WebSocket API
        - Authentication and ownership
        - Provider connection
        - Native tools
        - SQLite persistence
        - Deployment
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Bun version
      placeholder: bun --version
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include sanitized logs only. Remove credentials and user content.
      render: shell
