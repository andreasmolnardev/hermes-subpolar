name: Feature Request
description: Suggest an improvement to the Bun web API or browser UI.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Proposals should fit the single Bun process, authenticated `/v1` API,
        OpenAI-compatible provider, native tool boundaries, and SQLite state.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the API or UI behavior and its owning package.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web UI
        - HTTP or WebSocket API
        - Authentication and ownership
        - Provider boundary
        - Native tool boundary
        - SQLite persistence
        - Observability
        - Developer experience
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this in a pull request.
