name: "🔧 Setup / Installation Help"
description: Having trouble installing or configuring Hermes? Ask here.
title: "[Setup]: "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry you're having trouble! Please fill out the details below so we can help.

        **Quick checks first:**
         - Run `bun install --frozen-lockfile` from the repository root
         - Include server output and browser console errors below
        - Check the [README troubleshooting section](https://github.com/NousResearch/hermes-agent#troubleshooting)
        - For general questions, consider the [Nous Research Discord](https://discord.gg/NousResearch) for faster help

  - type: textarea
    id: description
    attributes:
      label: What's Going Wrong?
      description: Describe what you're trying to do and where it fails.
      placeholder: |
         I ran `bun run serve`, but when I open the web UI I get...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps Taken
      description: What did you do? Include the exact commands you ran.
      placeholder: |
        1. Ran `bun install --frozen-lockfile` from the repository root
        2. Ran `bun run serve`
        3. Opened the web UI and configured the required environment
        4. Received this error...
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - Manual clone + `bun install --frozen-lockfile`
        - Docker
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Ubuntu 24.04 / macOS 15.2 / Windows 11
    validations:
      required: true

  - type: input
    id: hermes-version
    attributes:
      label: Product Version
      description: Package version or commit being tested
      placeholder: "2.1.0"

  - type: textarea
    id: debug-report
    attributes:
      label: Runtime Logs
      description: |
        Paste the server output from `bun run serve` and any browser console or
        network errors that help identify the failure.
      placeholder: |
        Server:
        ...

        Browser console:
        ...
      render: shell

  - type: textarea
    id: error-output
    attributes:
      label: Full Error Output
      description: Paste the complete error message or stack trace. This will be auto-formatted.
      render: shell
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What I've Already Tried
      description: List any fixes or workarounds you've already attempted.
      placeholder: |
        - Ran `bun install --frozen-lockfile`
        - Checked that the required environment variables are set
