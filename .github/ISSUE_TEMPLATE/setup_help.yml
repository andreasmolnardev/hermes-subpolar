name: Setup Help
description: Ask for help running the Bun web application.
title: "[Setup]: "
labels: [setup]
body:
  - type: markdown
    attributes:
      value: |
        Start with `bun install` and `bun run serve`. Do not include API keys,
        session tokens, private database files, or provider responses.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What command or browser step fails?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps Taken
      description: Include exact sanitized commands and output.
    validations:
      required: true
  - type: input
    id: bun-version
    attributes:
      label: Bun version
      placeholder: bun --version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local Bun process
        - Container
        - Reverse proxy
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
