# Keep GitHub Actions revisions current. Bun package upgrades are deliberate
# changes reviewed with the workspace checks and lockfile policy.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(actions)
      include: scope
