name: CI

# Required PR and post-merge checks for the TypeScript/Bun runtime.
# Keep this graph explicit: branch protection requires only all-checks-pass.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundaries:
    name: Package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: ./.github/actions/retry
        with:
          command: bun install --frozen-lockfile
      - run: bun run check:boundaries
      - run: bun run test:boundaries

  pi-vendor:
    name: Pi vendor integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun run check:pi
      - run: bun run test:pi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: ./.github/actions/retry
        with:
          command: bun install --frozen-lockfile
      - run: bun run typecheck:runtime
      - run: cd tests-js && bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: ./.github/actions/retry
        with:
          command: bun install --frozen-lockfile
      - run: bun run test
      - run: cd tests-js && bun run test

  build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: ./.github/actions/retry
        with:
          command: bun install --frozen-lockfile
      - run: bun run build:web

  browser:
    name: Browser safety scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: ./.github/actions/retry
        with:
          command: bun install --frozen-lockfile
      - run: bun run check:boundaries

  docker-lint:
    name: Docker scans
    uses: ./.github/workflows/docker-lint.yml

  docker:
    name: Docker build
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker.yml

  osv-scanner:
    name: Dependency vulnerability scan
    uses: ./.github/workflows/osv-scanner.yml

  supply-chain:
    name: Supply-chain scan
    uses: ./.github/workflows/supply-chain-audit.yml

  history-check:
    name: History check
    uses: ./.github/workflows/history-check.yml

  infographic-check:
    name: Infographic check
    uses: ./.github/workflows/infographic-check.yml

  all-checks-pass:
    name: All required checks pass
    needs:
      - boundaries
      - pi-vendor
      - typecheck
      - test
      - build
      - browser
      - docker-lint
      - docker
      - osv-scanner
      - supply-chain
      - history-check
      - infographic-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate required checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure") | .key')
          if [ -n "$failed" ]; then
            printf '::error::Required checks failed:\n%s\n' "$failed"
            exit 1
          fi
          echo "All required checks passed or were skipped."
