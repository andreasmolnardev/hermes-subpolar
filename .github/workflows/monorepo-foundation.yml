name: Bun Monorepo Foundation

on:
  pull_request:
    paths:
      - ".bun-version"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "packages/**"
      - "scripts/check-package-boundaries.*"
      - ".github/workflows/monorepo-foundation.yml"
      - "scripts/verify-container.sh"
  push:
    branches: [main]
    paths:
      - ".bun-version"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "packages/**"
      - "scripts/check-package-boundaries.*"
      - ".github/workflows/monorepo-foundation.yml"
      - "scripts/verify-container.sh"

permissions:
  contents: read

jobs:
  foundation:
    name: Bun workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check:monorepo
      - run: bun run test

  docker:
    name: Docker Compose build and health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Verify health and graceful shutdown
        run: |
          bash scripts/verify-container.sh \
            --container hermes-subpolar \
            --url http://127.0.0.1:8080/api/health \
            --interval-seconds 5
      - if: always()
        run: docker compose down --volumes
