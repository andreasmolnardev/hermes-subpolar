name: Bun Monorepo Foundation

on:
  pull_request:
    paths:
      - ".bun-version"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "packages/**"
      - "scripts/check-package-boundaries.*"
      - ".github/workflows/monorepo-foundation.yml"
  push:
    branches: [main]
    paths:
      - ".bun-version"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "packages/**"
      - "scripts/check-package-boundaries.*"
      - ".github/workflows/monorepo-foundation.yml"

permissions:
  contents: read

jobs:
  foundation:
    name: Bun workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check:monorepo
      - run: bun run test

  python-regression:
    name: Python regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra dev
      - run: scripts/run_tests.sh tests/hermes_cli/test_commands.py

  docker:
    name: Docker Compose build and health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9119/api/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1
      - if: always()
        run: docker compose down --volumes
