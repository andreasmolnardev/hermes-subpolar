name: OSV Scanner

on:
  workflow_call:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan Bun lockfile
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: --lockfile=bun.lock
      results-file-name: osv-results.sarif
      fail-on-vuln: false
