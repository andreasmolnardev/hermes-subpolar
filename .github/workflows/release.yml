name: Release Subpolar

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release after printing the plan
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Plan and optionally publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Print release plan
        run: bun scripts/release.ts --dry-run
      - name: Publish GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts --publish
