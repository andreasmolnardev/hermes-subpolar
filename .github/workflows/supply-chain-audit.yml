name: Supply Chain Audit

# Scan only added PR lines for high-signal payload indicators. This is
# intentionally implemented with the runner's git and shell tools so it has no
# dependency on the application runtime or package environment.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Scan changed lines for payloads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Scan diff for critical patterns
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            DIFF=$(git diff "$BASE_SHA"..."$HEAD_SHA" -- . ':!*.lock' ':!bun.lock' || true)
            CHANGED=$(git diff --diff-filter=d --name-only "$BASE_SHA"..."$HEAD_SHA" || true)
          else
            DIFF=$(git diff HEAD~1 HEAD -- . ':!*.lock' ':!bun.lock' 2>/dev/null || true)
            CHANGED=$(git diff --diff-filter=d --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi

          FINDINGS=""

          PTH_FILES=$(printf '%s\n' "$CHANGED" | grep -E '\.pth$' || true)
          if [ -n "$PTH_FILES" ]; then
            FINDINGS="${FINDINGS}\n.pth files added or modified:\n${PTH_FILES}"
          fi

          B64_EXEC_HITS=$(printf '%s\n' "$DIFF" | grep -n '^+' | grep -iE 'base64\.(b64decode|decodebytes|urlsafe_b64decode)' | grep -iE 'exec\(|eval\(' | head -10 || true)
          if [ -n "$B64_EXEC_HITS" ]; then
            FINDINGS="${FINDINGS}\nBase64 decode combined with exec/eval:\n${B64_EXEC_HITS}"
          fi

          PROC_HITS=$(printf '%s\n' "$DIFF" | grep -n '^+' | grep -E 'subprocess\.(Popen|call|run)\s*\(' | grep -iE 'base64|\\x[0-9a-f]{2}|chr\(' | head -10 || true)
          if [ -n "$PROC_HITS" ]; then
            FINDINGS="${FINDINGS}\nEncoded subprocess command:\n${PROC_HITS}"
          fi

          SETUP_HITS=$(printf '%s\n' "$CHANGED" | grep -E '^(setup\.py|setup\.cfg|sitecustomize\.py|usercustomize\.py|__init__\.pth)$' || true)
          if [ -n "$SETUP_HITS" ]; then
            FINDINGS="${FINDINGS}\nInstall-hook files added or modified:\n${SETUP_HITS}"
          fi

          if [ -n "$FINDINGS" ]; then
            printf '%b\n' "$FINDINGS"
            echo '::error::Critical supply-chain patterns detected in changed files.'
            exit 1
          fi

          echo 'No critical supply-chain patterns detected.'
