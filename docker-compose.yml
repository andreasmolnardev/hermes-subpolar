# Subpolar self-hosted browser deployment.
# Docker Compose is the supported production entry point.
#
# Complete first-user bootstrap, provider connection, and agent selection in
# the browser after the first start.
#   docker compose up -d --build
#
# Put TLS and public authentication policy in a reverse proxy. Forward
# Host, X-Forwarded-Host, X-Forwarded-Proto, X-Forwarded-Prefix, and upgrade
# WebSocket connections for /v1/ws.
services:
  subpolar:
    build: .
    image: hermes-subpolar:local
    container_name: hermes-subpolar
    restart: unless-stopped
    ports:
      - '${SUBPOLAR_BIND:-127.0.0.1}:8080:8080'
    volumes:
      - subpolar_data:/opt/data
    environment:
      SUBPOLAR_HOST: 0.0.0.0
      SUBPOLAR_DATA_DIR: /opt/data
    command: ['bun', 'run', 'serve']
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:8080/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  subpolar_data:
